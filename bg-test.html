<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BG Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      color: white;
      font-size: 3rem;
      padding: 40px;
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="content">
    VIDEO SHOULD BE VISIBLE
  </div>

</body>
</html>
